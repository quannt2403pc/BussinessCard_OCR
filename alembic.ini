# Cau hinh Alembic.
# Chu so huu: Q | Task: 1.6
#
# !!! FILE NAY PHAI THUAN ASCII - KHONG DUOC DUNG TIENG VIET CO DAU !!!
# Alembic doc alembic.ini bang configparser voi encoding="locale" (util/compat.py:130).
# Tren Windows locale la cp1252, gap byte cua chu co dau la chet ca lenh:
#     UnicodeDecodeError: 'charmap' codec can't decode byte 0x9d
# Loi nay lam MOI lenh alembic tren may Windows khong chay duoc, ke ca `alembic heads`.
# PYTHONUTF8=1 va -X utf8 deu KHONG cuu duoc. Chu thich co dau thi de trong alembic/env.py
# (file .py doc bang UTF-8, khong dinh van de nay).
#
# CHI Q duoc sinh revision. Hai nguoi cung sinh se tao 2 head phai merge tay
# (CI co job "Chi mot head Alembic" bat loi nay ngay khi mo PR).
#
# Chuoi ket noi KHONG dat o day: alembic/env.py doc DATABASE_URL qua app.core.config
# de file .ini khong bao gio chua mat khau (gitleaks quet trong CI).

[alembic]
script_location = alembic
prepend_sys_path = .
# Ten file revision doc duoc: 20260910_1430-ab12cd34_khoi_tao_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = Asia/Ho_Chi_Minh
version_path_separator = os

[post_write_hooks]
# Co y de trong: image `api` khong cai ruff (chi co phu thuoc runtime), nen hook `ruff_format`
# se hong khi sinh revision bang `docker compose exec api alembic revision`.
# Sinh revision xong nho chay tay, neu khong se truot job lint cua CI:
#     ruff format alembic/versions/<file vua sinh>.py
hooks =

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
