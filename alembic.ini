# Cấu hình Alembic.
# Chủ sở hữu: Q | Task: 1.6
# LƯU Ý: CHỈ Q được sinh revision. Hai người cùng sinh sẽ tạo 2 head phải merge tay
#        (CI có job "Chỉ một head Alembic" bắt lỗi này ngay khi mở PR).
#
# Chuỗi kết nối KHÔNG đặt ở đây — `alembic/env.py` đọc `DATABASE_URL` qua app.core.config
# để .ini không bao giờ chứa mật khẩu (gitleaks quét trong CI).

[alembic]
script_location = alembic
prepend_sys_path = .
# Tên file revision đọc được: 20260910_1430-ab12cd34_khoi_tao_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = Asia/Ho_Chi_Minh
version_path_separator = os

[post_write_hooks]
# Cố ý để trống: image `api` không cài ruff (chỉ có phụ thuộc runtime), nên hook `ruff_format`
# sẽ hỏng khi sinh revision bằng `docker compose exec api alembic revision`.
# Sinh revision xong nhớ chạy tay, nếu không sẽ trượt job lint của CI:
#     ruff format alembic/versions/<file vừa sinh>.py
hooks =

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
