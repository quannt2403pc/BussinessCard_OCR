{% extends "base.html" %}
{% from "_macros.html" import banner %}
{% block title %}Đăng ký{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
  <img src="{{ url_for('static', path='img/logo-full.webp') }}?v={{ asset_v }}" alt="OCR Xì Mi"
       width="480" height="266" class="mx-auto mb-6 h-20 w-auto">
  <h1 class="text-2xl font-semibold text-brand-ink">Tạo tài khoản</h1>

  {% if error %}
  <div class="mt-4">{{ banner('error', error) }}</div>
  {% endif %}

  <form method="post" action="/auth/register" class="mt-6 space-y-4 rounded-lg border border-line bg-white p-6">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Email</span>
      <input type="email" name="email" value="{{ email }}" required autocomplete="email" autofocus
             class="mt-1 w-full rounded-md border border-line px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
    </label>
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Tên hiển thị <span class="font-normal text-muted">(không bắt buộc)</span></span>
      <input type="text" name="display_name" value="{{ display_name }}" maxlength="120" autocomplete="name"
             class="mt-1 w-full rounded-md border border-line px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
    </label>
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Mật khẩu</span>
      <input type="password" name="password" required minlength="{{ password_min_length }}" autocomplete="new-password"
             class="mt-1 w-full rounded-md border border-line px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
      <span class="mt-1 block text-xs text-muted">Ít nhất {{ password_min_length }} ký tự, có cả chữ lẫn số.</span>
    </label>
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Nhập lại mật khẩu</span>
      <input type="password" name="password_confirm" required autocomplete="new-password"
             class="mt-1 w-full rounded-md border border-line px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
    </label>
    <button type="submit" class="btn-primary w-full justify-center">Đăng ký</button>
  </form>

  <p class="mt-4 text-center text-sm text-muted">
    Đã có tài khoản?
    <a href="/auth/login{% if next and next != '/' %}?next={{ next | urlencode }}{% endif %}" class="link font-medium text-brand-700 hover:underline">Đăng nhập</a>
  </p>
</div>
{% endblock %}
