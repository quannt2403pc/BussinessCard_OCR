{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-2xl font-semibold text-slate-900">Tạo tài khoản</h1>
  <p class="mt-1 text-sm text-slate-500">Sau khi đăng ký, vào Cài đặt để tự kết nối AI bằng tài khoản Google của bạn.</p>

  {% if error %}
  <div class="mt-5 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/register" class="mt-6 space-y-4 rounded-lg border border-slate-200 bg-white p-5">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Email</span>
      <input type="email" name="email" value="{{ email }}" required autocomplete="email" autofocus
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500">
    </label>
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Tên hiển thị <span class="font-normal text-slate-400">(không bắt buộc)</span></span>
      <input type="text" name="display_name" value="{{ display_name }}" maxlength="120" autocomplete="name"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500">
    </label>
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Mật khẩu</span>
      <input type="password" name="password" required minlength="{{ password_min_length }}" autocomplete="new-password"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500">
      <span class="mt-1 block text-xs text-slate-500">Ít nhất {{ password_min_length }} ký tự, có cả chữ lẫn số.</span>
    </label>
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Nhập lại mật khẩu</span>
      <input type="password" name="password_confirm" required autocomplete="new-password"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500">
    </label>
    <button type="submit" class="w-full rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700">Đăng ký</button>
  </form>

  <p class="mt-4 text-center text-sm text-slate-500">
    Đã có tài khoản?
    <a href="/auth/login{% if next and next != '/' %}?next={{ next | urlencode }}{% endif %}" class="font-medium text-sky-700 hover:underline">Đăng nhập</a>
  </p>
</div>
{% endblock %}
