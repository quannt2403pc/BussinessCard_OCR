{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-2xl font-semibold text-slate-900">Đăng nhập</h1>
  <p class="mt-1 text-sm text-slate-500">Dữ liệu danh thiếp và hồ sơ doanh nghiệp của mỗi tài khoản là riêng.</p>

  {% if error %}
  <div class="mt-5 rounded-md border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/auth/login" class="mt-6 space-y-4 rounded-lg border border-slate-200 bg-white p-5">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Email</span>
      <input type="email" name="email" value="{{ email }}" required autocomplete="email" autofocus
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500">
    </label>
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Mật khẩu</span>
      <input type="password" name="password" required autocomplete="current-password"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500">
    </label>
    <button type="submit" class="w-full rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700">Đăng nhập</button>
  </form>

  <p class="mt-4 text-center text-sm text-slate-500">
    Chưa có tài khoản?
    <a href="/auth/register{% if next and next != '/' %}?next={{ next | urlencode }}{% endif %}" class="font-medium text-sky-700 hover:underline">Đăng ký</a>
  </p>
</div>
{% endblock %}
