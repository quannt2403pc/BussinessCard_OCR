# Chủ sở hữu: Q | Task: 1.4, hoàn thiện ở 9.1
#
#   api       build .                :8000   FastAPI + Web UI
#   db        pgvector/pgvector:pg16 :5432   PostgreSQL + extension vector
#   cliproxy  eceasy/cli-proxy-api   :8317   OAuth + gateway tới Gemini (task 2.1)
#   embedder  build ./embedder       :8001   sentence-transformers (T dựng ở task 3.10)
#   adminer   adminer                :8080   xem DB khi debug
#
# Chạy (task 9.1 — máy sạch, đúng một lệnh):
#   docker compose up -d
#   curl localhost:8000/health   -> {"status":"ok"}
#
# Hai bước `cp` thủ công trước đây đã bỏ:
#   * `.env`  — mọi biến bên dưới đều có mặc định `${VAR:-…}`, thiếu `.env` vẫn chạy. Chép
#     `.env.example` thành `.env` chỉ khi muốn đổi giá trị.
#   * `cliproxy/config.yaml` — service `cliproxy-init` tự tạo từ bản mẫu ở lần chạy đầu.
#     ⚠️ Đây không phải tiện nghi mà là **sửa một cái bẫy**: thiếu file, Docker thấy đường dẫn
#     bind mount không tồn tại và **tạo một thư mục** tên `config.yaml`, cliproxy chết kèm
#     thông báo không đoán ra nguyên nhân.
#
# `alembic upgrade head` cũng không phải gõ tay nữa — `docker-entrypoint.sh` chạy trước uvicorn
# (task 9.2). Tắt bằng `RUN_MIGRATIONS=0`.
#
# Nạp dữ liệu mẫu cho demo (task 9.2):
#   docker compose exec api python -m scripts.seed

name: businesscard-ocr

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bizcard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-bizcard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bizcard} -d ${POSTGRES_DB:-bizcard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      # Chỉ chờ container khởi động, KHÔNG chờ healthy: `api` vẫn phải lên được khi cliproxy
      # chết để trang /settings còn hiện được trạng thái "Chưa kết nối" (task 2.4, 9.4).
      cliproxy:
        condition: service_started
      # Cùng lý do, cộng thêm một lý do riêng: embedder nạp model mất vài chục giây
      # (`start_period: 60s`). Chờ `service_healthy` là mỗi lần `up` phải ngồi nhìn màn hình
      # chờ ngót một phút mới mở được trang danh thiếp, trong khi F1 không cần embedder.
      # Embedder chết thì các đường dùng nó trả 503 kèm thông báo rõ ràng (task 9.4).
      embedder:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://bizcard:change-me@db:5432/bizcard}
      CLIPROXY_BASE_URL: ${CLIPROXY_BASE_URL:-http://cliproxy:8317}
      CLIPROXY_MGMT_KEY: ${CLIPROXY_MGMT_KEY:-}
      CLIPROXY_AUTH_PROVIDER: ${CLIPROXY_AUTH_PROVIDER:-antigravity}
      # Phải có thật trong channel `antigravity` — xem I-03 trong Task.md.
      LLM_MODEL: ${LLM_MODEL:-gemini-3-flash}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:8001}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-7}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      # --- Vận hành (task 9.5 / 9.2) ---
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      # Entrypoint chạy `alembic upgrade head` trước uvicorn. Đặt 0 khi cố ý muốn lên với
      # schema hiện tại (ví dụ đang gỡ lỗi một migration hỏng).
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
      # Bind mount cho môi trường dev: sửa code là uvicorn --reload nạp lại, khỏi rebuild.
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # `scripts/` cũng mount: `python -m scripts.seed` (9.2) và `scripts/eval_retrieval.py`
      # (7.4) chạy trong container này, sửa script mà phải rebuild image thì vòng lặp đo đạc
      # chậm hẳn đi.
      - ./scripts:/app/scripts
      # `samples/` mount **chỉ đọc**, cho `python -m scripts.seed --demo` (task 11.2) đọc bộ
      # thẻ demo của T. Cố ý KHÔNG đưa vào image (`.dockerignore` loại `samples`): ảnh mẫu
      # không phải thứ nên nằm trong image chạy thật, nhất là khi image đó lên VPS ở D13.
      # `:ro` vì đây là dữ liệu của T — container không có việc gì phải ghi vào đó.
      - ./samples:/app/samples:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  cliproxy-init:
    # Chủ sở hữu: Q | Task: 9.1
    #
    # Một lệnh `cp` chạy đúng một lần, để máy sạch không phải gõ tay bước nào (tiêu chí A1).
    # Dùng **đúng image của cliproxy** chứ không kéo thêm alpine/busybox: image đó đã tải rồi,
    # thêm một image nữa là thêm một thứ phải tải trên máy mới.
    #
    # Không ghi đè nếu file đã có — `secret-key` trong `config.yaml` bị CLIProxy băm lại và ghi
    # đè ngay lần khởi động đầu, chép đè lên là xoá mất key thật của máy đó.
    image: ${CLIPROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    #
    # Viết trên **một dòng**: dạng `>` của YAML giữ nguyên xuống dòng ở những dòng thụt sâu hơn,
    # nên script nhiều dòng vào tới `sh` là `Syntax error: "&&" unexpected` (đã vấp thật).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "if [ -f /conf/config.yaml ]; then echo 'cliproxy/config.yaml da co - giu nguyen'; else cp /conf/config.example.yaml /conf/config.yaml && echo 'da tao cliproxy/config.yaml tu ban mau - secret-key mac dinh: change-me'; fi"
    volumes:
      - ./cliproxy:/conf
    restart: "no"

  cliproxy:
    # Chủ sở hữu: Q | Task: 2.1
    #
    # Dùng image công khai, KHÔNG build từ mã nguồn: ta không sửa gì trong CLIProxy, mà build
    # một image Go 1.26 chỉ tốn thời gian. Nhờ vậy máy nào clone repo về cũng chạy được — không
    # cần có sẵn mã nguồn CLIProxyAPI ở máy (xem I-06).
    #
    # `:latest` không tái lập được — upstream đẩy bản mới là hành vi đổi. Chốt xong ở 2.1 thì
    # ghim theo tag phiên bản hoặc digest, đặt qua biến CLIPROXY_IMAGE trong .env.
    image: ${CLIPROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    depends_on:
      cliproxy-init:
        condition: service_completed_successfully
    # Mount **thư mục** `./cliproxy` rồi trỏ `-config` vào file bên trong, thay vì bind mount
    # thẳng `./cliproxy/config.yaml` như trước.
    #
    # Đây là bản sửa một cái bẫy đo được ngày 2026-09-18: `depends_on` **không** bảo vệ được
    # bind mount kiểu file. Compose tạo container của mọi service **trước** khi chạy service
    # nào, và Docker dựng đường dẫn bind mount ngay lúc *create* — nên khi `cliproxy-init` còn
    # chưa chạy thì Docker đã kịp tạo một **thư mục** rỗng tên `config.yaml`. Mount cả thư mục
    # thì không còn đường dẫn nào để Docker tự bịa ra: `./cliproxy` luôn tồn tại trong repo.
    #
    # `-config` là cờ có sẵn của CLIProxy (`CLIProxyAPI --help`), không phải mẹo.
    command: ["./CLIProxyAPI", "-config", "/conf/config.yaml"]
    volumes:
      # `config.yaml` KHÔNG commit (chứa management key) — `cliproxy-init` tạo từ bản mẫu.
      # CLIProxy băm `secret-key` rồi ghi đè lại chính file này, nên phải ghi được.
      #
      # Cái giá của việc mount cả thư mục: CLIProxy còn ghi thêm `static/management.html`
      # (~2.8MB, bảng điều khiển của nó) vào đây mỗi lần khởi động → đã cho vào `.gitignore`.
      - ./cliproxy:/conf
      # Token OAuth phải sống qua restart, nếu không mỗi lần up lại phải đăng nhập lại (rủi ro R1).
      - cliproxy_auths:/root/.cli-proxy-api
    ports:
      - "8317:8317"
      # ⚠️ I-04 — cổng callback OAuth của Antigravity (internal/auth/antigravity/constants.go:8).
      # Thiếu cổng này thì bấm nút OAuth đi tới Google, đồng ý xong trình duyệt quay về
      # localhost:51121 và chết — token không bao giờ được lưu.
      - "51121:51121"
    restart: unless-stopped

  embedder:
    # T dựng thư mục `embedder/` ở task 3.10; khối này khai sẵn từ D1 để T không phải sửa file
    # của Q (Task.md, mục "Ba chỗ hai người gọi code của nhau").
    #
    # 3.10 xong (2026-09-14) nên `profiles: ["embedder"]` đã gỡ: `docker compose up -d` nay
    # dựng luôn embedder, đúng tiêu chí A1 (một lệnh chạy cả hệ thống).
    # ⚠️ Lần build đầu kéo torch + nhúng model vào image (~2.8GB), mất vài phút.
    build: ./embedder
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    ports:
      - "8001:8001"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Nạp model sentence-transformers lần đầu mất vài chục giây.
      start_period: 60s
    restart: unless-stopped

  adminer:
    image: adminer:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  # Token OAuth của CLIProxy — giữ lại giữa các lần restart (rủi ro R1).
  cliproxy_auths:
